name: CI

on:
    pull_request:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: Install deps
              run: npm ci

            - name: Lint (all)
              run: npm run lint

            - name: Type check (all)
              run: npm run type-check

            - name: Build (client + server)
              run: npm run build
